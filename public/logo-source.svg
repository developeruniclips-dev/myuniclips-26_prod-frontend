<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Mortarboard (top cap part) -->
  <path d="M 30 90 L 100 40 L 170 90 L 170 95 L 30 95 Z" fill="#1a1f3a" stroke="#0f1419" stroke-width="2"/>
  
  <!-- Mortarboard border/3D effect -->
  <path d="M 100 40 L 170 90 L 170 95 L 100 50 Z" fill="#2d3561"/>
  
  <!-- Tassel bulb (top) -->
  <circle cx="145" cy="75" r="8" fill="#f59e0b"/>
  
  <!-- Tassel string -->
  <line x1="145" y1="83" x2="145" y2="135" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Tassel fringe -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
    <line x1="135" y1="135" x2="130" y2="155"/>
    <line x1="145" y1="135" x2="145" y2="160"/>
    <line x1="155" y1="135" x2="160" y2="155"/>
  </g>
  
  <!-- Cap base/cylinder -->
  <rect x="50" y="95" width="100" height="35" rx="3" fill="#1a1f3a" stroke="#0f1419" stroke-width="2"/>
  
  <!-- Cap base shading -->
  <ellipse cx="100" cy="130" rx="50" ry="8" fill="#2d3561"/>
  
  <!-- Shadow/base -->
  <ellipse cx="100" cy="145" rx="55" ry="6" fill="#00000020"/>
</svg>
